name: Build Android APK (High Compatibility)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan tombol "Run workflow" di HP via Chrome Desktop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Unduh kode sumber proyek
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set Java ke JDK 17 (Paling stabil, menghindari error versi Java)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Optimasi Cache Gradle
    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    # 4. Beri izin penuh pada gradlew dan setujui lisensi Android SDK
    - name: Prepare Build Environment
      run: |
        chmod +x gradlew || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    # 5. Jalankan proses Build dengan penanganan error ramah memori
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    # 6. Unggah file APK hasil kompilasi
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always() # Tetap jalankan langkah ini walau ada peringatan minor
      with:
        name: android-app-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
        
