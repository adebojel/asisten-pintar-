name: Build Android APK

# Memicu workflow secara otomatis saat ada Push ke branch main/master,
# atau bisa dijalankan manual via tab Actions (workflow_dispatch)
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengunduh isi repositori ke server runner GitHub
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Mengkonfigurasi Java Development Kit (JDK)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Memberikan izin eksekusi pada script Gradle Wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Melakukan build file APK Debug
    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    # 5. Mengunggah file APK hasil build ke bagian Artifacts
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
