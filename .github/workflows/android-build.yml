name: Build Android APK (Fix Exit Code 127)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Unduh kode sumber proyek
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Solusi Exit Code 127: Pasang Gradle bawaan & buat file gradlew jika hilang
    - name: Setup Gradle & Regenerate Wrapper
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle
        if [ ! -f "gradlew" ]; then
          echo "File gradlew tidak ditemukan. Membuat gradlew baru..."
          gradle wrapper
        fi
        chmod +x gradlew

    # 4. Jalankan proses Build
    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    # 5. Unggah file APK hasil kompilasi
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: android-app-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7
        
